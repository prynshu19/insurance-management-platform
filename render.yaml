databases:
  - name: insurance-db
    databaseName: insurancedb
    user: insuranceuser
    plan: free

services:
  - type: web
    name: insurance-management-platform
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: insurance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
